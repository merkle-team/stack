name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # Upload artifacts and cut releases
  id-token: write # OIDC

jobs:
  publish-docker-images:
    timeout-minutes: 20 # Sometimes build takes a while
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ vars.FARCASTERXYZ_DOCKERHUB_USER }}
          password: ${{ secrets.FARCASTERXYZ_DOCKERHUB_WRITE_PASSWORD }}

      - run: env STACK_VERSION=${{ github.ref_name }} ./bin/publish-image.sh
        shell: bash

      - name: Append version tag to executable
        shell: bash
        run: |
          mkdir -p ./build
          touch ./build/stack
          chmod +x ./build/stack
          echo "${{ github.ref_name }}" | cat bin/exec-stack-via-docker.sh - > ./build/stack

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          # Tags with a hyphen (e.g. v1.2.3-pre1) are treated as pre-releases
          # so they don't become the "latest" pointer that install.sh follows.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          files: build/stack
